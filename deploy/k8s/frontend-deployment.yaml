apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-frontend
  labels:
    app: kong-manager-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-frontend
  template:
    metadata:
      labels:
        app: kong-manager-frontend
    spec:
      containers:
      - name: frontend
        image: images.hmisp.com.vn/h-iam/ga-manager-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: ""
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-frontend
spec:
  selector:
    app: kong-manager-frontend
  ports:
  - port: 3000
    targetPort: 3000
