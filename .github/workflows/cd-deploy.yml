name: CD - Automated & Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Target Environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      deploy_mode:
        description: 'Deployment Strategy'
        required: true
        type: choice
        options:
          - docker-compose
          - kubernetes
        default: 'docker-compose'
      image_tag:
        description: 'Image tag to deploy (e.g. latest, sha-xxxxxxx, v1.0.0)'
        required: true
        type: string
        default: 'latest'

jobs:
  deploy-docker-compose:
    name: Deploy with Docker Compose
    if: inputs.deploy_mode == 'docker-compose'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment to ${{ inputs.environment }} with Docker Compose..."
            
            APP_DIR="${{ secrets.DEPLOY_PATH || '/opt/kong-manager' }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Log in to GitHub Container Registry on the remote host
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull target container images
            BACKEND_IMAGE="ghcr.io/${{ github.repository }}/backend:${{ inputs.image_tag }}"
            FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/frontend:${{ inputs.image_tag }}"

            echo "📦 Pulling images:"
            echo " - Backend:  $BACKEND_IMAGE"
            echo " - Frontend: $FRONTEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # Tag images locally to match docker-compose references if needed
            docker tag "$BACKEND_IMAGE" kong-manager-backend:latest
            docker tag "$FRONTEND_IMAGE" kong-manager-frontend:latest

            # Deploy or restart services
            if [ -f "deploy/docker-compose.yml" ]; then
              docker compose -f deploy/docker-compose.yml up -d --remove-orphans
            elif [ -f "docker-compose.yml" ]; then
              docker compose up -d --remove-orphans
            fi

            # Health verification
            echo "🩺 Running health verification checks..."
            sleep 5
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "✅ Backend service is healthy!"
                break
              fi
              echo "Waiting for backend health check ($i/12)..."
              sleep 5
            done

            echo "🎉 Deployment to ${{ inputs.environment }} completed successfully!"

  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    if: inputs.deploy_mode == 'kubernetes'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Update Deployment Image Tags
        run: |
          BACKEND_IMAGE="ghcr.io/${{ github.repository }}/backend:${{ inputs.image_tag }}"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/frontend:${{ inputs.image_tag }}"
          
          # Replace image placeholders in manifests
          sed -i "s|image: kong-manager-backend:.*|image: ${BACKEND_IMAGE}|g" deploy/k8s/backend-deployment.yaml
          sed -i "s|image: kong-manager-frontend:.*|image: ${FRONTEND_IMAGE}|g" deploy/k8s/frontend-deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deploy/k8s/postgres-redis.yaml
          kubectl apply -f deploy/k8s/backend-deployment.yaml
          kubectl apply -f deploy/k8s/frontend-deployment.yaml

      - name: Verify Rollout Status (with Auto Rollback on Failure)
        run: |
          echo "Verifying backend deployment rollout..."
          if ! kubectl rollout status deployment/kong-manager-backend --timeout=180s; then
            echo "::error::Backend rollout failed. Initiating automated rollback..."
            kubectl rollout undo deployment/kong-manager-backend
            exit 1
          fi

          echo "Verifying frontend deployment rollout..."
          if ! kubectl rollout status deployment/kong-manager-frontend --timeout=180s; then
            echo "::error::Frontend rollout failed. Initiating automated rollback..."
            kubectl rollout undo deployment/kong-manager-frontend
            exit 1
          fi

          echo "🎉 Kubernetes rollout completed successfully!"
