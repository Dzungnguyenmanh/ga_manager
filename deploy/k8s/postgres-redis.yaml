apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-postgres
  labels:
    app: kong-manager-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-postgres
  template:
    metadata:
      labels:
        app: kong-manager-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "kongmanager"
        - name: POSTGRES_PASSWORD
          value: "kongmanager_password"
        - name: POSTGRES_DB
          value: "kongmanager"
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-postgres
spec:
  selector:
    app: kong-manager-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-redis
  labels:
    app: kong-manager-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-redis
  template:
    metadata:
      labels:
        app: kong-manager-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-redis
spec:
  selector:
    app: kong-manager-redis
  ports:
  - port: 6379
    targetPort: 6379
