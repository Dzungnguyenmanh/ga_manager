# ==============================================================================
# H-IAM Microservice CI/CD Pipeline (GitLab CI)
# Service: ga-manager (Gateway Manager Control Plane)
# Deploy Targets: Harbor Registry (Docker/Podman) & ArgoCD GitOps
# ==============================================================================

stages:
  - lint
  - test
  - build
  - gitops-sync

variables:
  SERVICE_NAME: "ga-manager"
  BACKEND_SERVICE_NAME: "ga-manager-backend"
  FRONTEND_SERVICE_NAME: "ga-manager-frontend"
  HARBOR_HOST: "images.hmisp.com.vn"
  HARBOR_PROJECT: "h-iam"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  GOPRIVATE: "gitlab.com/h-iam/*"
  ARGOCD_APP_NAME: "hiam-gateway-manager"

default:
  tags:
    - HIAM-RUNNER
  image: golang:alpine
  before_script:
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache git ca-certificates make protobuf-dev curl bash >/dev/null 2>&1 || true; fi
    - if [ -n "$GITLAB_TOKEN" ]; then git config --global url."https://oauth2:${GITLAB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"; else git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"; fi || true

# ==============================================================================
# 1. LINT STAGE
# ==============================================================================
lint:backend:
  stage: lint
  image: golangci/golangci-lint:v1.61-alpine
  before_script:
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache git >/dev/null 2>&1 || true; fi
    - if [ -n "$GITLAB_TOKEN" ]; then git config --global url."https://oauth2:${GITLAB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"; else git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"; fi || true
  script:
    - 'echo "Running golangci-lint on $BACKEND_SERVICE_NAME..."'
    - export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
    - cd backend
    - if command -v golangci-lint >/dev/null 2>&1; then golangci-lint run --timeout 5m ./...; else echo "golangci-lint not found on runner, skipping..."; fi
    - if command -v go >/dev/null 2>&1; then go vet ./...; fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:frontend:
  stage: lint
  image: node:22-alpine
  before_script:
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache git >/dev/null 2>&1 || true; fi
  script:
    - 'echo "Running TypeScript check and ESLint on $FRONTEND_SERVICE_NAME..."'
    - cd frontend
    - if command -v npm >/dev/null 2>&1; then npm ci --legacy-peer-deps && npx tsc --noEmit && npm run lint; else echo "npm not found on runner, skipping..."; fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:declarative:
  stage: lint
  image: kong/deck:v1.38.0
  before_script: []
  script:
    - 'echo "Validating Kong declarative configurations and Kubernetes manifests..."'
    - |
      for config in kong.yaml deploy/kong.yaml; do
        if [ -f "$config" ]; then
          echo "Validating $config with decK..."
          deck file validate -s "$config"
        fi
      done
      echo "Validating Kubernetes YAML syntax..."
      if command -v apk >/dev/null 2>&1; then apk add --no-cache python3 py3-yaml >/dev/null 2>&1 || true; fi
      if command -v python3 >/dev/null 2>&1; then
        python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('deploy/k8s/*.yaml')]; print('All Kubernetes manifests validated successfully.')"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# 2. TEST STAGE
# ==============================================================================
test:backend:
  stage: test
  script:
    - 'echo "Running unit tests for $BACKEND_SERVICE_NAME..."'
    - export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
    - cd backend
    - touch coverage.out
    - if command -v go >/dev/null 2>&1; then go test -v -cover -coverprofile=coverage.out ./...; else echo "go not found on runner, skipping..."; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - backend/coverage.out
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:frontend:
  stage: test
  image: node:22-alpine
  before_script:
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache git >/dev/null 2>&1 || true; fi
  script:
    - 'echo "Running unit tests for $FRONTEND_SERVICE_NAME..."'
    - cd frontend
    - if [ -f "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" && (nvm use 22 || nvm use 20 || true); fi
    - export NODE_OPTIONS="--require $(pwd)/vitest-preload.cjs"
    - if command -v npm >/dev/null 2>&1; then npm ci --legacy-peer-deps && npm run test; else echo "npm not found on runner, skipping..."; fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# 3. BUILD & PUBLISH (HARBOR - PODMAN & DOCKER SUPPORT)
# ==============================================================================
build:backend:
  stage: build
  image: docker:24.0.9
  services:
    - name: docker:24.0.9-dind
      alias: docker
  before_script:
    - |
      if command -v podman >/dev/null 2>&1; then
        export DOCKER_CMD="podman"
      elif command -v docker >/dev/null 2>&1; then
        export DOCKER_CMD="docker"
      else
        echo "❌ ERROR: Neither podman nor docker is installed on this runner!"
        exit 1
      fi
      echo "Using container engine: $DOCKER_CMD"
    - |
      if [ -n "$HARBOR_USERNAME" ] && [ -n "$HARBOR_PASSWORD" ]; then
        echo "$HARBOR_PASSWORD" | $DOCKER_CMD login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST";
        export REGISTRY_URL="$HARBOR_HOST/$HARBOR_PROJECT";
      elif [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | $DOCKER_CMD login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY";
        export REGISTRY_URL="$CI_REGISTRY_IMAGE";
      else
        export REGISTRY_URL="$HARBOR_HOST/$HARBOR_PROJECT";
      fi
  script:
    - 'echo "=========================================================="'
    - 'echo "  🚀 BUILDING BACKEND CONTAINER: $BACKEND_SERVICE_NAME"'
    - 'echo "  Engine: $DOCKER_CMD | Target Registry: $REGISTRY_URL"'
    - 'echo "  Commit SHA: $CI_COMMIT_SHA | Branch: $CI_COMMIT_REF_SLUG"'
    - 'echo "=========================================================="'
    - IMAGE_TAG_SHA="$REGISTRY_URL/$BACKEND_SERVICE_NAME:$CI_COMMIT_SHA"
    - IMAGE_TAG_SLUG="$REGISTRY_URL/$BACKEND_SERVICE_NAME:$CI_COMMIT_REF_SLUG"
    - IMAGE_TAG_LATEST="$REGISTRY_URL/$BACKEND_SERVICE_NAME:latest"
    - $DOCKER_CMD build
        --build-arg GITLAB_TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}"
        -t "$IMAGE_TAG_SHA"
        -t "$IMAGE_TAG_SLUG"
        -f backend/Dockerfile backend/
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
        $DOCKER_CMD tag "$IMAGE_TAG_SHA" "$IMAGE_TAG_LATEST";
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        $DOCKER_CMD tag "$IMAGE_TAG_SHA" "$REGISTRY_URL/$BACKEND_SERVICE_NAME:$CI_COMMIT_TAG";
      fi
    - 'echo "Pushing Backend images to Container Registry..."'
    - |
      if [ -n "$HARBOR_USERNAME" ] || [ -n "$CI_REGISTRY_USER" ]; then
        $DOCKER_CMD push "$IMAGE_TAG_SHA";
        $DOCKER_CMD push "$IMAGE_TAG_SLUG";
        if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
          $DOCKER_CMD push "$IMAGE_TAG_LATEST";
        fi;
        if [ -n "$CI_COMMIT_TAG" ]; then
          $DOCKER_CMD push "$REGISTRY_URL/$BACKEND_SERVICE_NAME:$CI_COMMIT_TAG";
        fi;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

build:frontend:
  stage: build
  image: docker:24.0.9
  services:
    - name: docker:24.0.9-dind
      alias: docker
  before_script:
    - |
      if command -v podman >/dev/null 2>&1; then
        export DOCKER_CMD="podman"
      elif command -v docker >/dev/null 2>&1; then
        export DOCKER_CMD="docker"
      else
        echo "❌ ERROR: Neither podman nor docker is installed on this runner!"
        exit 1
      fi
      echo "Using container engine: $DOCKER_CMD"
    - |
      if [ -n "$HARBOR_USERNAME" ] && [ -n "$HARBOR_PASSWORD" ]; then
        echo "$HARBOR_PASSWORD" | $DOCKER_CMD login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST";
        export REGISTRY_URL="$HARBOR_HOST/$HARBOR_PROJECT";
      elif [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | $DOCKER_CMD login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY";
        export REGISTRY_URL="$CI_REGISTRY_IMAGE";
      else
        export REGISTRY_URL="$HARBOR_HOST/$HARBOR_PROJECT";
      fi
  script:
    - 'echo "=========================================================="'
    - 'echo "  🚀 BUILDING FRONTEND CONTAINER: $FRONTEND_SERVICE_NAME"'
    - 'echo "  Engine: $DOCKER_CMD | Target Registry: $REGISTRY_URL"'
    - 'echo "  Commit SHA: $CI_COMMIT_SHA | Branch: $CI_COMMIT_REF_SLUG"'
    - 'echo "=========================================================="'
    - IMAGE_TAG_SHA="$REGISTRY_URL/$FRONTEND_SERVICE_NAME:$CI_COMMIT_SHA"
    - IMAGE_TAG_SLUG="$REGISTRY_URL/$FRONTEND_SERVICE_NAME:$CI_COMMIT_REF_SLUG"
    - IMAGE_TAG_LATEST="$REGISTRY_URL/$FRONTEND_SERVICE_NAME:latest"
    - $DOCKER_CMD build
        -t "$IMAGE_TAG_SHA"
        -t "$IMAGE_TAG_SLUG"
        -f frontend/Dockerfile frontend/
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
        $DOCKER_CMD tag "$IMAGE_TAG_SHA" "$IMAGE_TAG_LATEST";
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        $DOCKER_CMD tag "$IMAGE_TAG_SHA" "$REGISTRY_URL/$FRONTEND_SERVICE_NAME:$CI_COMMIT_TAG";
      fi
    - 'echo "Pushing Frontend images to Container Registry..."'
    - |
      if [ -n "$HARBOR_USERNAME" ] || [ -n "$CI_REGISTRY_USER" ]; then
        $DOCKER_CMD push "$IMAGE_TAG_SHA";
        $DOCKER_CMD push "$IMAGE_TAG_SLUG";
        if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "master" ]; then
          $DOCKER_CMD push "$IMAGE_TAG_LATEST";
        fi;
        if [ -n "$CI_COMMIT_TAG" ]; then
          $DOCKER_CMD push "$REGISTRY_URL/$FRONTEND_SERVICE_NAME:$CI_COMMIT_TAG";
        fi;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# 4. ARGOCD GITOPS SYNC
# ==============================================================================
argocd:sync:
  stage: gitops-sync
  image: argoproj/argocd:latest
  before_script: []
  script:
    - 'echo "=========================================================="'
    - 'echo "  🔄 TRIGGERING ARGOCD GITOPS SYNC FOR: $ARGOCD_APP_NAME"'
    - 'echo "=========================================================="'
    - |
      if [ -n "$ARGOCD_SERVER" ] && ( [ -n "$ARGOCD_AUTH_TOKEN" ] || [ -n "$ARGOCD_PASSWORD" ] ); then
        if ! command -v argocd >/dev/null 2>&1; then
          echo "⬇️ Downloading argocd CLI..."
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 || true
          chmod +x /tmp/argocd || true
          export PATH="/tmp:$PATH"
        fi

        export ARGOCD_OPTS="--grpc-web"

        if [ -n "$ARGOCD_AUTH_TOKEN" ]; then
          export ARGOCD_AUTH_TOKEN="$ARGOCD_AUTH_TOKEN"
        elif [ -n "$ARGOCD_USERNAME" ] && [ -n "$ARGOCD_PASSWORD" ]; then
          argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USERNAME" --password "$ARGOCD_PASSWORD" $ARGOCD_OPTS
        fi

        for APP in "kong-manager" "$ARGOCD_APP_NAME"; do
          echo "Syncing application $APP..."
          argocd app sync "$APP" --server "$ARGOCD_SERVER" $ARGOCD_OPTS --prune --force || echo "⚠️ Warning: 'argocd app sync' for $APP skipped or requires additional permissions."
          argocd app actions run "$APP" restart --kind Deployment --all --server "$ARGOCD_SERVER" $ARGOCD_OPTS || true
        done
      else
        echo "ℹ️ ARGOCD_SERVER or ARGOCD_AUTH_TOKEN not set. Skipping automated ArgoCD trigger."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
