apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-backend
  labels:
    app: kong-manager-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-backend
  template:
    metadata:
      labels:
        app: kong-manager-backend
    spec:
      containers:
      - name: backend
        image: kong-manager-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kong-manager-secrets
              key: database-url
              optional: true
        - name: REDIS_URL
          value: "redis://kong-manager-redis:6379/0"
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-backend
spec:
  selector:
    app: kong-manager-backend
  ports:
  - port: 8080
    targetPort: 8080
