name: CI - Quality Gate & Automated Testing

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Go Modules
        working-directory: ./backend
        run: |
          go mod download
          go mod verify

      - name: Code Formatting Check (gofmt)
        working-directory: ./backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Static Analysis (go vet)
        working-directory: ./backend
        run: go vet ./...

      - name: Run Unit Tests with Coverage
        working-directory: ./backend
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage.out
          retention-days: 7

      - name: Verify Backend Binary Compilation
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux go build -v -o /dev/null ./cmd/api

  frontend-ci:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Checking (tsc)
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Verify Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  manifests-validation:
    name: Deployment Manifests & Config Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f deploy/docker-compose.yml config

      - name: Validate Kubernetes Manifests Syntax
        run: |
          kubectl apply --dry-run=client -f deploy/k8s/

  ci-status-check:
    name: All CI Checks Passed
    runs-on: ubuntu-24.04
    needs: [ backend-ci, frontend-ci, manifests-validation ]
    if: always()
    steps:
      - name: Verify Overall CI Gate
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "::error::Backend CI failed"
            exit 1
          fi
          if [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "::error::Frontend CI failed"
            exit 1
          fi
          if [ "${{ needs.manifests-validation.result }}" != "success" ]; then
            echo "::error::Manifests validation failed"
            exit 1
          fi
          echo "All quality gates and automated tests passed successfully!"
