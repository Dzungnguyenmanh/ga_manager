apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-backend
  labels:
    app: kong-manager-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong-manager-backend
  template:
    metadata:
      labels:
        app: kong-manager-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kong-manager-backend
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: backend
        image: images.hmisp.com.vn/h-iam/ga-manager-backend:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DB_HOST
          value: "kong-manager-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "kongmanager"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kong-manager-secrets
              key: db-password
        - name: DB_NAME
          value: "kongmanager"
        - name: DB_SSLMODE
          value: "disable"
        - name: REDIS_URL
          value: "redis://kong-manager-redis:6379/0"
        - name: KONG_TLS_SKIP_VERIFY
          value: "false"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kong-manager-secrets
              key: jwt-secret
        - name: INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kong-manager-secrets
              key: initial-admin-password
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      imagePullSecrets:
      - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-backend
  labels:
    app: kong-manager-backend
spec:
  selector:
    app: kong-manager-backend
  ports:
  - port: 8080
    targetPort: 8080
    name: http
