apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-frontend
  labels:
    app: kong-manager-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong-manager-frontend
  template:
    metadata:
      labels:
        app: kong-manager-frontend
      annotations:
        rollout/commit: "6858f4f14d84319f38dfd1f63be6d95fd1438155"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kong-manager-frontend
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: frontend
        image: images.hmisp.com.vn/h-iam/ga-manager-frontend:6858f4f14d84319f38dfd1f63be6d95fd1438155
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: NEXT_PUBLIC_API_URL
          value: ""
        - name: NEXT_PUBLIC_SSO_URL
          value: "https://sso.hmisp.com.vn"
        - name: NEXT_PUBLIC_SSO_TENANT_ID
          value: "TNSHMISP000000"
        - name: NEXT_PUBLIC_SSO_REALM
          value: "hmisp"
        - name: NEXT_PUBLIC_SSO_CLIENT_ID
          value: "hiam-client-Id"
        livenessProbe:
          httpGet:
            path: /login
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /login
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      imagePullSecrets:
      - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-frontend
  labels:
    app: kong-manager-frontend
spec:
  selector:
    app: kong-manager-frontend
  ports:
  - port: 3000
    targetPort: 3000
    name: http
