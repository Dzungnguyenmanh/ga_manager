apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kong-manager-postgres
  labels:
    app: kong-manager-postgres
spec:
  serviceName: "kong-manager-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-postgres
  template:
    metadata:
      labels:
        app: kong-manager-postgres
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kong-manager-postgres
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_USER
          value: "kongmanager"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kong-manager-secrets
              key: db-password
        - name: POSTGRES_DB
          value: "kongmanager"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U kongmanager -d kongmanager
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U kongmanager -d kongmanager
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app: kong-manager-postgres
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-postgres
  labels:
    app: kong-manager-postgres
spec:
  selector:
    app: kong-manager-postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-redis
  labels:
    app: kong-manager-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-redis
  template:
    metadata:
      labels:
        app: kong-manager-redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kong-manager-redis
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-redis
  labels:
    app: kong-manager-redis
spec:
  selector:
    app: kong-manager-redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
