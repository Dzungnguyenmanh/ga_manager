apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-manager-backend
  labels:
    app: kong-manager-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-manager-backend
  template:
    metadata:
      labels:
        app: kong-manager-backend
    spec:
      containers:
      - name: backend
        image: images.hmisp.com.vn/h-iam/ga-manager-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgres://kongmanager:kongmanager_password@10.105.55.165:5432/kongmanager?sslmode=disable"
        - name: DB_HOST
          value: "10.105.55.165"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "kongmanager"
        - name: DB_PASSWORD
          value: "kongmanager_password"
        - name: DB_NAME
          value: "kongmanager"
        - name: REDIS_URL
          value: "redis://10.96.179.194:6379/0"
        - name: KONG_TLS_SKIP_VERIFY
          value: "true"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      imagePullSecrets:
      - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager-backend
spec:
  selector:
    app: kong-manager-backend
  ports:
  - port: 8080
    targetPort: 8080
